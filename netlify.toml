[build]
  publish = "."
  functions = "netlify/functions"

# Same-origin API path the frontend already calls
[[redirects]]
  from = "/api/lhs-calendar"
  to = "/.netlify/functions/lhs-calendar"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
